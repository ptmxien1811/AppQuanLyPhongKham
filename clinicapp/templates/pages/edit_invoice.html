{% extends 'layout/base.html' %}

{% block content %}
<body style="background-color: #D5E1E6">

<div class="treatment-form-wrapper p-4">
<div class="container mt-4">
    <h4 class="fw-bold text-primary mb-3">
        <i class="bi bi-pencil-square"></i> Sửa hóa đơn
    </h4>

    <form method="post" class="card shadow-sm p-4">
        <div class="mb-3">
            <label class="form-label fw-semibold">Bệnh nhân</label>
            <input type="text" class="form-control" value="{{ invoice.patient.name }}" disabled>
        </div>

        <div class="mb-3">
            <label class="form-label fw-semibold">Bác sĩ phụ trách</label>
            <select name="doctor_id" class="form-select" required>
                {% for d in doctors %}
                    <option value="{{ d.id }}" {% if invoice.doctor.id == d.id %}selected{% endif %}>
                        {{ d.name }}{% if d.specialty %} - {{ d.specialty }}{% endif %}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label fw-semibold">Ngày khám</label>
            <input type="date" name="created_date" class="form-control" value="{{ invoice.created_date }}">
        </div>

        <div class="mb-3">
            <label class="form-label fw-semibold">Tổng tiền dịch vụ</label>
            <input type="text" class="form-control" value="{{ invoice.total_service }}" disabled>
        </div>

        <div class="mb-3">
            <label class="form-label fw-semibold">Tổng tiền thuốc</label>
            <input type="text" class="form-control" value="{{ invoice.total_medicine }}" disabled>
        </div>

        <div class="mb-3">
            <label class="form-label fw-semibold">VAT</label>
            <input type="text" class="form-control" value="{{ invoice.vat }}" disabled>
        </div>

        <div class="mb-3">
            <label class="form-label fw-semibold">Tổng cộng</label>
            <input type="text" class="form-control fw-bold text-danger" value="{{ invoice.total_payment }}" disabled>
        </div>

        <div class="d-flex justify-content-between">
            <button type="submit" class="btn btn-success">
                <i class="bi bi-save"></i> Lưu thay đổi
            </button>
            <a href="{{ url_for('invoice_list') }}" class="btn btn-secondary">
                <i class="bi bi-arrow-left"></i> Quay lại
            </a>
        </div>
    </form>
</div>
</div>
</body>
{% endblock %}
