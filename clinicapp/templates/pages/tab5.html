{% extends 'layout/base.html' %}
{% block content %}
<div class="container mt-4">

    <!-- TIÊU ĐỀ -->
    <h4 class="fw-bold text-primary mb-4">
        <i class="bi bi-bar-chart"></i> Báo cáo doanh thu
    </h4>

    <!-- LỌC THEO NGÀY -->
    <form method="get" class="row g-2 mb-4">
        <div class="col-md-3">
            <input type="date" name="from_date" class="form-control" value="{{ from_date }}">
        </div>
        <div class="col-md-3">
            <input type="date" name="to_date" class="form-control" value="{{ to_date }}">
        </div>
        <div class="col-md-2">
            <button class="btn btn-primary w-100">
                <i class="bi bi-funnel"></i> Lọc
            </button>
        </div>
    </form>

    <!-- BIỂU ĐỒ -->
    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <canvas id="revenueChart" height="90"></canvas>
        </div>
    </div>

    <hr>

    <!-- DOANH THU THEO BÁC SĨ -->
    <h5 class="fw-bold text-success mb-3">
        <i class="bi bi-person-badge"></i> Doanh thu theo bác sĩ
    </h5>

    <form method="get" class="row g-2 mb-3">
        <div class="col-md-4">
            <select name="doctor_id" class="form-select">
                <option value="">-- Chọn bác sĩ --</option>
                {% for d in doctors %}
                <option value="{{ d.id }}"
                    {% if doctor_id and doctor_id|int == d.id %}selected{% endif %}>
                    {{ d.name }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="col-md-3">
            <input type="date" name="from_date" class="form-control" value="{{ from_date }}">
        </div>

        <div class="col-md-3">
            <input type="date" name="to_date" class="form-control" value="{{ to_date }}">
        </div>

        <div class="col-md-2">
            <button class="btn btn-success w-100">
                <i class="bi bi-search"></i> Xem
            </button>
        </div>
    </form>

    {% if doctor_revenue %}
    <div class="alert alert-info">
        <strong>{{ doctor_revenue[0] }}</strong> :
        {{ "{:,.0f}".format(doctor_revenue[1]) }} VNĐ
    </div>
    {% endif %}

</div>

<!-- DATA TRUYỀN SANG JS -->
<div id="chart-data"
     data-labels='{{ labels | tojson }}'
     data-values='{{ values | tojson }}'>
</div>

<!-- SCRIPT -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="{{ url_for('static', filename='tab5.js') }}"></script>
{% endblock %}
