<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Trang chủ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
            crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
          integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
          crossorigin="anonymous" referrerpolicy="no-referrer"/>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"/>
    <link rel="stylesheet" href="../../static/login.css">

</head>

{%block content%}

{%if err_msg%}
<div class="alert alert-danger">{{err_msg}}</div>

{%endif%}
<body>
<div class="wrapper">

    <form method="POST" action="/register" enctype="multipart/form-data">
        <h1>Đăng ký</h1>
        <div class="input-box">
            <input type="text" id="name" name="name" placeholder="Họ và tên" required>
        </div>
        <div class="input-box">
            <input type="text" id="username" name="username" placeholder="Tên đăng nhập" required>
        </div>
        <div class="input-box">
            <input type="password" id="password" name="password" placeholder="Mật khẩu" pattern=".{3,}" required>
        </div>
        <div class="input-box">
            <input type="password" id="confirm" name="confirm" placeholder="Nhập lại mật khẩu">
        </div>
        <div class="input-box">
            <input type="file" id="avatar" name="avatar" placeholder="Ảnh đại diện">
        </div>

        <button type="submit" class="btn">Đăng ký</button>
    </form>
</div>


</body>


{%endblock%}
